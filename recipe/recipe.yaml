# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: 1.0.0

package:
  name: django-lasuite
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/django-lasuite/django_lasuite-${{ version }}.tar.gz
  sha256: 8921aaba5a78f1f9728cee2cc4596755478108f17146d4a2fccb393c043a05a3

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - django >=5.2
tests:
  - python:
      imports:
        - lasuite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  homepage: https://github.com/suitenumerique/django-lasuite
  repository: https://github.com/suitenumerique/django-lasuite
  license: MIT
  license_file: LICENSE
  summary: Common Django library for La Suite numérique projects
  description: |
    django-lasuite is the common Django library shared across La Suite
    numérique (French government's open-source digital suite). It bundles
    OIDC integration, DRF helpers, malware-detection utilities, and admin
    customizations used by docs, meet, drive, messages, calc, and others.

extra:
  recipe-maintainers:
    - rxm7706
